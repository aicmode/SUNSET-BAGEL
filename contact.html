<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>お問い合わせ | SUNSET BAGEL</title>
    <meta name="description" content="ケータリング、コラボレーション、ニュースレター登録など、SUNSET BAGELへのお問い合わせはこちら。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header" data-header>
      <a class="brand" href="index.html">SUNSET BAGEL</a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" data-nav-toggle><span></span><span></span></button>
      <nav class="site-nav" data-nav>
        <a href="index.html">HOME</a><a href="about.html">ABOUT</a><a href="menu.html">MENU</a><a href="gallery.html">GALLERY</a><a href="location.html">LOCATION</a><a href="contact.html">CONTACT</a>
      </nav>
    </header>

    <main>
      <section class="contact-hero section">
        <div class="reveal">
          <p class="eyebrow">CONTACT</p>
          <h1>Tell Us Your Morning Ritual.</h1>
          <p>ケータリング、ローカルコラボレーション、ちょっとしたご相談まで。いただいたメッセージは、コーヒーを片手に丁寧に拝見します。</p>
        </div>
        <img class="reveal" src="assets/images/bagel-coffee-wrapper-no-logo.png" alt="朝のカフェカウンターのコーヒーとブルーベリーベーグル">
      </section>

      <section class="section contact-grid">
        <form class="contact-form reveal">
          <label>お名前<input type="text" name="name" autocomplete="name"></label>
          <label>メールアドレス<input type="email" name="email" autocomplete="email"></label>
          <label>お問い合わせ内容<textarea name="message" rows="6"></textarea></label>
          <button class="button primary" type="submit">送信する</button>
        </form>
        <aside class="contact-aside reveal">
          <div>
            <p class="eyebrow">SOCIAL</p>
            <h2>焼きたての空気を、日々お届けします。</h2>
            <a class="text-link" href="https://www.instagram.com/" target="_blank" rel="noreferrer">@sunsetbagel</a>
          </div>
          <form class="newsletter">
            <label>ニュースレター<input type="email" name="newsletter" placeholder="メールアドレス"></label>
            <button class="button secondary" type="submit">登録する</button>
          </form>
          <img src="https://images.pexels.com/photos/5543125/pexels-photo-5543125.jpeg?auto=compress&cs=tinysrgb&w=900" alt="クリームチーズを添えた焼きたてベーグル">
        </aside>
      </section>
    </main>

    <footer class="site-footer"><p>&copy; 2026 SUNSET BAGEL</p><a href="https://www.instagram.com/">Instagram</a></footer>
    <script src="script.js"></script>
  </body>
</html>
