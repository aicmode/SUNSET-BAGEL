<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | SUNSET BAGEL</title>
    <meta name="description" content="Contact SUNSET BAGEL for catering, neighborhood notes, and newsletter signups.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header" data-header>
      <a class="brand" href="index.html">SUNSET BAGEL</a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" data-nav-toggle><span></span><span></span></button>
      <nav class="site-nav" data-nav>
        <a href="index.html">Home</a><a href="about.html">About</a><a href="menu.html">Menu</a><a href="gallery.html">Gallery</a><a href="location.html">Location</a><a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="contact-hero section">
        <div class="reveal">
          <p class="eyebrow">Contact</p>
          <h1>Tell us what you are craving.</h1>
          <p>For catering, local collaborations, and neighborhood notes, send us a message. We read everything over coffee.</p>
        </div>
        <img class="reveal" src="https://images.unsplash.com/photo-1559305616-3f99cd43e353?auto=format&fit=crop&w=1200&q=85" alt="Coffee shop counter with fresh drinks">
      </section>

      <section class="section contact-grid">
        <form class="contact-form reveal">
          <label>Name<input type="text" name="name" autocomplete="name"></label>
          <label>Email<input type="email" name="email" autocomplete="email"></label>
          <label>Message<textarea name="message" rows="6"></textarea></label>
          <button class="button primary" type="submit">Send Message</button>
        </form>
        <aside class="contact-aside reveal">
          <div>
            <p class="eyebrow">Social</p>
            <h2>Follow the bake.</h2>
            <a class="text-link" href="https://www.instagram.com/" target="_blank" rel="noreferrer">@sunsetbagel</a>
          </div>
          <form class="newsletter">
            <label>Newsletter<input type="email" name="newsletter" placeholder="your@email.com"></label>
            <button class="button secondary" type="submit">Subscribe</button>
          </form>
          <img src="https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=900&q=85" alt="Surfboard and beach lifestyle near the ocean">
        </aside>
      </section>
    </main>

    <footer class="site-footer"><p>&copy; 2026 SUNSET BAGEL</p><a href="https://www.instagram.com/">Instagram</a></footer>
    <script src="script.js"></script>
  </body>
</html>
